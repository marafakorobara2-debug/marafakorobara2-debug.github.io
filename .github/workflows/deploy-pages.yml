name: Publier Go Digital sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Préparer le lien vers le site dynamique
        run: cp -R github-pages out

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
